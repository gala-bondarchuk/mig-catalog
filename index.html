<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Миг — фигуры в наличии</title>
<meta name="description" content="Фольгированные фигуры, звёзды, сердца, цифры и латекс в наличии. Выберите шар — соберём композицию под ваш праздник.">
<meta name="theme-color" content="#AF5A38">
<link rel="icon" href="assets/logo-terra.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Kudry Headline'; src: url('assets/kudry-headline.woff') format('woff'); font-display: swap; }
  @font-face { font-family: 'Golos Local'; src: url('assets/golos-regular.woff') format('woff'); font-display: swap; }

  /* Палитра Миг (брендбук) */
  :root {
    --milk: #F6F3EE;
    --paper: #FAFAF7;
    --sand: #E7DFD2;
    --sage: #6E6A2B;
    --olive: #5F6141;
    --pistachio: #C7CCA4;
    --choco: #2E241C;
    --choco-soft: #5C4E42;
    --rose: #D9A2B7;
    --terracotta: #C46A46;
    --terra-deep: #AF5A38;
    --wine: #571C26;
    --sans: 'Golos Text', 'Golos Local', system-ui, sans-serif;
    --display: 'Kudry Headline', 'Golos Text', Georgia, serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--milk); color: var(--choco); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; }
  a { color: var(--terra-deep); }
  :focus-visible { outline: 2px solid var(--terra-deep); outline-offset: 3px; border-radius: 6px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .star { display: block; width: 18px; height: 18px; margin: 0 auto; }

  /* Шапка — как фирменная наклейка: терракота, тонкая рамка, звезда */
  .hero { padding-top: 16px; }
  .panel {
    position: relative; background: var(--terra-deep); color: var(--milk);
    border-radius: 22px; padding: 30px 24px 32px; text-align: center; overflow: hidden;
  }
  .panel::after {
    content: ''; position: absolute; inset: 10px; border: 1px solid rgba(246, 243, 238, .45);
    border-radius: 14px; pointer-events: none;
  }
  .panel .logo { width: min(170px, 46vw); height: auto; margin: 8px auto 4px; }
  h1 {
    font: 400 clamp(40px, 11vw, 70px)/1.05 var(--display); margin: 6px 0 0; letter-spacing: 0;
  }
  .rule { width: 64px; height: 1px; background: currentColor; opacity: .6; margin: 18px auto; border: 0; }
  .lead { margin: 0 auto; max-width: 30em; font-size: 16px; color: rgba(246, 243, 238, .92); }
  @media (min-width: 720px) { .panel { padding: 40px 48px 44px; } }

  /* Поиск и категории */
  .bar { position: sticky; top: 0; z-index: 5; background: rgba(246, 243, 238, .94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 14px 0 10px; margin-top: 10px; border-bottom: 1px solid transparent; transition: border-color .2s; }
  .bar.stuck { border-bottom-color: var(--sand); }
  .search { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 1px solid var(--sand); border-radius: 999px; padding: 0 16px; height: 48px; max-width: 560px; }
  .search svg { flex: none; color: var(--choco-soft); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; color: var(--choco); height: 100%; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .search input::placeholder { color: #8D8073; }
  .search:focus-within { border-color: var(--terra-deep); }
  .clear { border: 0; background: none; padding: 6px; cursor: pointer; color: var(--choco-soft); display: none; }
  .search.has-text .clear { display: block; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 2px; margin: 0 -16px; scrollbar-width: none; scroll-snap-type: x proximity; scroll-padding-inline: 16px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; scroll-snap-align: start; border: 1px solid var(--sand); background: var(--paper); color: var(--choco); border-radius: 999px; padding: 8px 16px; font-size: 15px; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
  .chip[aria-pressed="true"] { background: var(--terra-deep); border-color: var(--terra-deep); color: var(--milk); }

  /* Карточки — тона палитры, тонкая внутренняя рамка */
  main { padding: 16px 0 40px; }
  .count { color: var(--olive); font-size: 14px; margin: 0 0 14px; min-height: 21px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; } }
  @media (min-width: 980px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card { position: relative; display: flex; flex-direction: column; border-radius: 18px; padding: 12px 12px 14px; }
  .card::after { content: ''; position: absolute; inset: 6px; border: 1px solid currentColor; opacity: .22; border-radius: 13px; pointer-events: none; }
  .tone-0 { background: var(--rose); color: var(--wine); }
  .tone-1 { background: var(--pistachio); color: var(--choco); }
  .tone-2 { background: var(--sand); color: var(--choco); }
  .photo { position: relative; z-index: 1; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #fff; border: 0; padding: 0; cursor: zoom-in; width: 100%; }
  .photo img { width: 100%; height: 100%; object-fit: contain; }
  .photo .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--choco-soft); font-size: 13px; }
  .name { position: relative; z-index: 1; font: 500 16px/1.25 var(--sans); margin: 12px 4px 2px; overflow-wrap: anywhere; }
  .size { position: relative; z-index: 1; margin: 0 4px; font-size: 13px; opacity: .8; }
  .actions { position: relative; z-index: 1; margin-top: auto; padding-top: 12px; }
  .want { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 44px; border-radius: 999px; padding: 10px 14px; background: var(--terra-deep); color: var(--milk); text-decoration: none; font-weight: 500; font-size: 15px; transition: background .15s; }
  .want:hover { background: var(--wine); }
  .write { display: block; text-align: center; font-size: 13px; color: inherit; opacity: .85; margin-top: 7px; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .write:hover { opacity: 1; }

  .skeleton { background: var(--sand); animation: pulse 1.4s ease-in-out infinite; min-height: 280px; }
  @keyframes pulse { 50% { opacity: .55; } }

  .empty { grid-column: 1 / -1; text-align: center; padding: 44px 8px; max-width: 30em; margin: 0 auto; }
  .empty h2 { font: 400 32px/1.15 var(--display); color: var(--olive); margin: 14px 0 8px; }
  .empty p { color: var(--choco-soft); margin: 0 0 18px; }
  .empty .want { display: inline-flex; width: auto; padding: 10px 24px; }
  .ghost { border: 1px solid var(--sand); background: var(--paper); border-radius: 999px; padding: 10px 24px; cursor: pointer; }

  footer { text-align: center; padding: 26px 0 44px; color: var(--choco-soft); font-size: 14px; }
  footer .logo { width: 96px; height: auto; margin: 16px auto 12px; }
  footer p { margin: 0 auto 6px; max-width: 34em; }

  /* Просмотр фото */
  dialog { border: 0; padding: 0; background: transparent; max-width: none; max-height: none; width: 100%; height: 100%; color: var(--choco); }
  dialog::backdrop { background: rgba(46, 36, 28, .6); }
  .viewer { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; }
  .sheet { position: relative; background: var(--paper); border-radius: 24px; width: min(540px, 100%); max-height: calc(100dvh - 32px); overflow: auto; padding: 14px 14px 22px; animation: rise .22s ease-out; }
  .sheet::after { content: ''; position: absolute; inset: 7px; border: 1px solid var(--sand); border-radius: 18px; pointer-events: none; }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } }
  .big { position: relative; z-index: 1; border-radius: 16px; overflow: hidden; background: #fff; aspect-ratio: 1; }
  .big img { width: 100%; height: 100%; object-fit: contain; }
  .info { position: relative; z-index: 1; padding: 16px 8px 0; text-align: center; }
  .info h2 { font: 400 30px/1.15 var(--display); color: var(--olive); margin: 10px 0 4px; }
  .info .size { margin: 0 0 16px; font-size: 15px; color: var(--choco-soft); opacity: 1; }
  .info .want { min-height: 50px; font-size: 16px; }
  .info .write { color: var(--choco-soft); }
  .icon-btn { position: absolute; z-index: 2; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(250, 250, 247, .94); display: grid; place-items: center; cursor: pointer; color: var(--choco); box-shadow: 0 1px 0 var(--sand); }
  .close { top: 22px; right: 22px; }
  .nav { top: calc(14px + (min(540px, 100vw - 32px) - 28px) / 2 - 21px); }
  .prev { left: 22px; } .next { right: 22px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 0c.6 6.6 2.4 10.6 12 12-9.6 1.4-11.4 5.4-12 12-.6-6.6-2.4-10.6-12-12C9.6 10.6 11.4 6.6 12 0z" fill="currentColor"/></symbol>
</svg>

<header class="hero wrap">
  <div class="panel">
    <img class="logo" src="assets/logo-milk.png" alt="Миг">
    <h1>Фигуры в&nbsp;наличии</h1>
    <hr class="rule">
    <p class="lead">Выберите шар, который нравится, — соберём с ним композицию под ваш праздник и бюджет</p>
  </div>
</header>

<div class="bar" id="bar">
  <div class="wrap">
    <label class="search" id="searchBox">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Найти: зайчик, мишка, единорог" autocomplete="off" aria-label="Поиск по названию">
      <button class="clear" id="clear" type="button" aria-label="Очистить поиск">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </label>
    <div class="chips" id="chips" role="toolbar" aria-label="Категории"></div>
  </div>
</div>

<main class="wrap">
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
</main>

<footer class="wrap">
  <img class="logo" src="assets/logo-choco.png" alt="Миг">
  <p>Здесь только то, что сейчас есть в мастерской. Список обновляется сам.</p>
  <p>Не нашли нужную фигуру? <a id="footerWrite" href="#" target="_blank" rel="noopener">Напишите мне</a> — подберу похожую или закажу.</p>
  <p id="footerInsta" hidden><a target="_blank" rel="noopener">@mig.sgt</a></p>
</footer>

<dialog id="viewer" aria-label="Просмотр фото">
  <div class="viewer" id="viewerBg">
    <div class="sheet">
      <div class="big"><img id="vImg" alt=""></div>
      <button class="icon-btn close" id="vClose" type="button" aria-label="Закрыть"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <button class="icon-btn nav prev" id="vPrev" type="button" aria-label="Предыдущая"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="icon-btn nav next" id="vNext" type="button" aria-label="Следующая"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
      <div class="info">
        <svg class="star" style="color: var(--sage); width: 14px; height: 14px"><use href="#star"/></svg>
        <h2 id="vName"></h2>
        <p class="size" id="vSize"></p>
        <a class="want" id="vWant" target="_blank" rel="noopener">Хочу эту</a>
        <a class="write" id="vWrite" target="_blank" rel="noopener">Написать мне</a>
      </div>
    </div>
  </div>
</dialog>

<script src="config.js"></script>
<script>
const CFG = Object.assign({ API_URL: '', BOT_USERNAME: 'mig_sgt_bot', CONTACT_URL: 'https://t.me/mig_sgt_bot', INSTAGRAM_URL: '' }, window.MIG_CONFIG || {});
// Какие категории показывать клиентам. Чтобы добавить, например, цифры: ['Фигуры', 'Цифры'].
// Можно задать в config.js строкой SHOW_CATEGORIES: ['Фигуры', 'Цифры'], — тогда этот файл не трогать.
const SHOW_CATEGORIES = CFG.SHOW_CATEGORIES || ['Фигуры'];
const $ = (id) => document.getElementById(id);
const state = { items: [], categories: [], cat: 'all', q: '', shown: [], open: -1 };

const norm = (s) => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
const wantUrl = (it) => 'https://t.me/' + CFG.BOT_USERNAME + '?start=fig_' + encodeURIComponent(it.id);
const plural = (n) => { const a = n % 10, b = n % 100; if (a === 1 && b !== 11) return 'позиция'; if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return 'позиции'; return 'позиций'; };
const fallbackSrc = (it, w) => (it.driveId ? 'https://drive.google.com/thumbnail?id=' + it.driveId + '&sz=w' + w : '');

function el(tag, attrs, children) {
  const n = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => { if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (v !== null && v !== undefined) n.setAttribute(k, v); });
  (children || []).forEach((c) => c && n.appendChild(c));
  return n;
}
function starIcon(color) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'star'); if (color) s.style.color = color;
  const u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#star'); s.appendChild(u);
  return s;
}
function photo(it, w) {
  if (!it.photo) return el('span', { class: 'noimg', text: 'Фото скоро будет' });
  const img = el('img', { src: w > 500 ? it.photo : (it.thumb || it.photo), alt: it.name + (it.size ? ', ' + it.size : ''), loading: 'lazy', decoding: 'async' });
  img.addEventListener('error', function onErr() { const fb = fallbackSrc(it, w); if (fb && img.src !== fb) img.src = fb; else img.removeEventListener('error', onErr); });
  return img;
}

function renderChips() {
  const box = $('chips'); box.innerHTML = '';
  [['all', 'Все']].concat(state.categories.map((c) => [c, c])).forEach(([val, label]) => {
    const b = el('button', { class: 'chip', type: 'button', 'aria-pressed': String(state.cat === val), text: label });
    b.addEventListener('click', () => { state.cat = val; renderChips(); render(); });
    box.appendChild(b);
  });
}

function emptyBlock(title, text, action) {
  return el('div', { class: 'empty' }, [starIcon('var(--sage)'), el('h2', { text: title }), el('p', { text: text }), action]);
}

function render() {
  const q = norm(state.q);
  const tones = {}; state.categories.forEach((c, i) => { tones[c] = i % 3; });
  state.shown = state.items.filter((it) => (state.cat === 'all' || it.category === state.cat) && (!q || norm(it.name + ' ' + it.size + ' ' + it.category).includes(q)));
  const grid = $('grid'); grid.innerHTML = '';
  const n = state.shown.length;
  $('count').textContent = n ? n + ' ' + plural(n) + (state.cat !== 'all' ? ' в категории «' + state.cat + '»' : ' в наличии') : '';
  if (!n) {
    const write = el('a', { class: 'want', href: CFG.CONTACT_URL, target: '_blank', rel: 'noopener', text: 'Написать мне' });
    grid.appendChild(state.items.length
      ? emptyBlock('Ничего не нашлось', q ? 'По запросу «' + state.q + '» сейчас ничего нет в наличии. Напишите мне — подберу похожее.' : 'В этой категории сейчас пусто.', write)
      : emptyBlock('Скоро здесь появятся фигуры', 'Пока список пуст. Напишите мне, и я расскажу, что есть.', write));
    return;
  }
  const frag = document.createDocumentFragment();
  state.shown.forEach((it, i) => {
    const ph = el('button', { class: 'photo', type: 'button', 'aria-label': 'Открыть фото: ' + it.name }, [photo(it, 400)]);
    ph.addEventListener('click', () => openViewer(i));
    const tone = state.categories.length < 2 ? i % 3 : (tones[it.category] ?? 2);
    frag.appendChild(el('article', { class: 'card tone-' + tone }, [
      ph,
      el('h3', { class: 'name', text: it.name }),
      it.size ? el('p', { class: 'size', text: it.size }) : null,
      el('div', { class: 'actions' }, [
        el('a', { class: 'want', href: wantUrl(it), target: '_blank', rel: 'noopener', text: 'Хочу эту' }),
        el('a', { class: 'write', href: CFG.CONTACT_URL, target: '_blank', rel: 'noopener', text: 'Написать мне' }),
      ]),
    ]));
  });
  grid.appendChild(frag);
}

function renderSkeleton() {
  const grid = $('grid'); grid.innerHTML = '';
  for (let i = 0; i < 6; i++) grid.appendChild(el('div', { class: 'card skeleton', 'aria-hidden': 'true' }));
  $('count').textContent = 'Загружаю каталог…';
}
function renderError() {
  const grid = $('grid'); grid.innerHTML = ''; $('count').textContent = '';
  const retry = el('button', { class: 'ghost', type: 'button', text: 'Обновить' });
  retry.addEventListener('click', load);
  grid.appendChild(emptyBlock('Не удалось загрузить каталог', 'Проверьте интернет и нажмите «Обновить». Если не получится — напишите мне, пришлю фото того, что есть.', retry));
}

function openViewer(i) {
  state.open = i;
  const it = state.shown[i], img = $('vImg');
  img.src = it.photo || ''; img.alt = it.name;
  img.onerror = () => { const fb = fallbackSrc(it, 1000); if (fb && img.src !== fb) img.src = fb; };
  $('vName').textContent = it.name;
  $('vSize').textContent = it.size || '';
  $('vWant').href = wantUrl(it);
  $('vWrite').href = CFG.CONTACT_URL;
  $('vPrev').hidden = i <= 0;
  $('vNext').hidden = i >= state.shown.length - 1;
  if (!$('viewer').open) $('viewer').showModal();
}
$('vClose').addEventListener('click', () => $('viewer').close());
$('vPrev').addEventListener('click', () => state.open > 0 && openViewer(state.open - 1));
$('vNext').addEventListener('click', () => state.open < state.shown.length - 1 && openViewer(state.open + 1));
$('viewerBg').addEventListener('click', (e) => { if (e.target === $('viewerBg')) $('viewer').close(); });
document.addEventListener('keydown', (e) => { if (!$('viewer').open) return; if (e.key === 'ArrowLeft') $('vPrev').click(); if (e.key === 'ArrowRight') $('vNext').click(); });
let touchX = null;
$('viewer').addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
$('viewer').addEventListener('touchend', (e) => { if (touchX === null) return; const dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 60) (dx > 0 ? $('vPrev') : $('vNext')).click(); touchX = null; });

let t;
$('q').addEventListener('input', (e) => { state.q = e.target.value; $('searchBox').classList.toggle('has-text', !!state.q); clearTimeout(t); t = setTimeout(render, 120); });
$('clear').addEventListener('click', () => { $('q').value = ''; state.q = ''; $('searchBox').classList.remove('has-text'); render(); $('q').focus(); });

const sentinel = el('div', { style: 'height:1px;margin-top:-1px' }); $('bar').before(sentinel);
new IntersectionObserver(([e]) => $('bar').classList.toggle('stuck', !e.isIntersecting)).observe(sentinel);

function apply(data) {
  const show = (c) => !SHOW_CATEGORIES.length || SHOW_CATEGORIES.includes(c);
  state.items = (Array.isArray(data.items) ? data.items : []).filter((it) => show(it.category));
  state.categories = (Array.isArray(data.categories) ? data.categories : []).filter(show);
  $('chips').hidden = state.categories.length < 2;
  if (state.cat !== 'all' && !state.categories.includes(state.cat)) state.cat = 'all';
  renderChips(); render();
}
async function load() {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem('mig-catalog') || 'null'); } catch (e) {}
  if (cached) apply(cached); else renderSkeleton();
  try {
    if (!/^https:/.test(CFG.API_URL)) throw new Error('В config.js не указана ссылка склада');
    const r = await fetch(CFG.API_URL, { redirect: 'follow' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    apply(data);
    try { localStorage.setItem('mig-catalog', JSON.stringify(data)); } catch (e) {}
  } catch (err) {
    console.warn(err);
    if (!cached) renderError();
  }
}

$('footerWrite').href = CFG.CONTACT_URL;
if (CFG.INSTAGRAM_URL) { const p = $('footerInsta'); p.querySelector('a').href = CFG.INSTAGRAM_URL; p.hidden = false; }
load();
</script>
</body>
</html>
